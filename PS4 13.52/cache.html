<html manifest="cache.appcache">
<head>
<title>alaa mohamed 01001550618</title>
<style>
html {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background-color: #0b0d10;
    background-image: url("background.jpg");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}
.info {
    position: absolute;
    top: 45%;
    left: 50%;
    font-size: 22px;
    font-family: monospace;
    color: #f72828;
    transform: translate(-50%, -50%);
}
</style>
<script>
history.replaceState(null, null, 'index.html');
var histlength = history.length;
history.go(-histlength);

function DLProgress(e) {
    var pct = Math.round(e.loaded / e.total * 100);
    msgs.innerHTML = "alaa mohamed &middot; Installing ... " + pct + "%";
}

function DisplayCacheProgress() {
    setTimeout(function () {
        msgs.innerHTML = "mansoor0x &middot; Cache OK";
    }, 2000);
    setTimeout(function () {
        location.reload();
    }, 3000);
}

window.applicationCache.addEventListener("progress",    DLProgress,           false);
window.applicationCache.oncached     = function (e) { DisplayCacheProgress(); };
window.applicationCache.onupdateready = function (e) { DisplayCacheProgress(); };
</script>
</head>
<body>
<div id="msgs" class="info"></div>
</body>
</html>
