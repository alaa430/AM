<!DOCTYPE html>
<html manifest="cache.manifest" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚜️ alaa mohamed - تحميل الكاش</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: #0d0d0d;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .box {
            background: #161616;
            border: 1px solid rgba(212, 160, 23, 0.2);
            border-radius: 20px;
            padding: 40px 45px;
            text-align: center;
            max-width: 480px;
            width: 100%;
        }
        .logo { font-size: 55px; margin-bottom: 8px; }
        h1 { color: #e8d5a0; font-size: 26px; font-weight: 700; }
        h1 span {
            background: linear-gradient(180deg, #f9e08a, #b8860b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sub { color: #a0926a; font-size: 13px; letter-spacing: 3px; margin: 4px 0 18px 0; }
        .line { width: 70px; height: 2px; margin: 0 auto 20px auto; background: linear-gradient(90deg, transparent, #d4a017, transparent); }
        #msg {
            color: #00ff88;
            font-size: 17px;
            font-weight: 700;
            padding: 18px;
            background: #0a0a0a;
            border-radius: 12px;
            border: 1px solid rgba(212, 160, 23, 0.06);
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
        }
        .loader {
            width: 35px;
            height: 35px;
            margin: 12px auto 0 auto;
            border: 3px solid rgba(212, 160, 23, 0.1);
            border-top: 3px solid #d4a017;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .foot { margin-top: 18px; color: #7a6e4a; font-size: 11px; letter-spacing: 1px; }
        @media (max-width: 480px) {
            .box { padding: 25px 20px; }
            h1 { font-size: 21px; }
            .logo { font-size: 42px; }
            #msg { font-size: 14px; padding: 14px; min-height: 55px; }
        }
    </style>
    <script>
        history.replaceState(null, null, 'index.html');
        var h = history.length;
        history.go(-h);
        
        function prog(e) {
            var p = (Math.round(e.loaded / e.total * 100));
            document.getElementById('msg').innerHTML = '📦 تحميل الكاش ... ' + p + '%<div class="loader"></div>';
            document.title = '⚜️ ' + p + '%';
        }
        
        function done() {
            document.getElementById('msg').innerHTML = '✅ تم التثبيت!<br>🔄 جاري إعادة التحميل...';
            document.title = '⚜️ تم! ✓';
            setTimeout(function() { window.location.reload(); }, 1500);
        }
        
        function err() {
            document.getElementById('msg').innerHTML = '❌ فشل التحميل<br>📌 حاول تحديث الصفحة';
            document.title = '⚜️ فشل';
        }
        
        window.applicationCache.addEventListener("progress", prog, false);
        window.applicationCache.oncached = done;
        window.applicationCache.onupdateready = done;
        window.applicationCache.onerror = err;
        window.applicationCache.onobsolete = err;
        
        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById('msg').innerHTML = '⏳ جاري التحميل...<div class="loader"></div>';
        });
    </script>
</head>
<body>
    <div class="box">
        <div class="logo">⚜️</div>
        <h1>alaa mohamed <span>PS4/PS5</span></h1>
        <p class="sub">النسخة الذهبية</p>
        <div class="line"></div>
        <div id="msg">⏳ جاري التحميل...</div>
        <div class="foot">⚜️ Golden Edition v3.0</div>
    </div>
</body>
</html>
